
name: Build SimpleMTKClient macOS Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          uname -m

      - name: Build Intel x86_64 app
        run: |
          xcodebuild \
            -project SimpleMTK.xcodeproj \
            -scheme SimpleMTK \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build \
            -arch x86_64 \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify and package Intel app
        run: |
          APP="build/Build/Products/Release/SimpleMTK.app"

          test -d "$APP"

          file "$APP/Contents/MacOS/SimpleMTK"

          lipo -verify_arch x86_64 "$APP/Contents/MacOS/SimpleMTK"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/SimpleMTKClient-x86_64.zip"

      - name: Upload Intel app
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMTKClient-x86_64
          path: ${{ runner.temp }}/SimpleMTKClient-x86_64.zip
          if-no-files-found: error
