name: Build SimpleMTKClient macOS Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build x86_64 Release
        run: |
          set -o pipefail
          xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO -scheme SimpleMTK -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Verify and package x86_64 app
        run: |
          APP="build/Build/Products/Release/SimpleMTK.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/SimpleMTK"
          lipo -verify_arch x86_64 "$APP/Contents/MacOS/SimpleMTK"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/SimpleMTKClient-x86_64.zip"

      - name: Upload x86_64 app
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMTKClient-x86_64
          path: ${{ runner.temp }}/SimpleMTKClient-x86_64.zip
          if-no-files-found: error
