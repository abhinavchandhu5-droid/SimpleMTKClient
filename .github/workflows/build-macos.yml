
name: Build SimpleMTKClient macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Clear Swift package caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Build Intel macOS app
        run: |
          xcodebuild \
            -project SimpleMTK.xcodeproj \
            -scheme SimpleMTK \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/SimpleMTKBuild" \
            -destination "generic/platform=macOS" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package built app
        run: |
          APP=$(find "$RUNNER_TEMP/SimpleMTKBuild/Build/Products/Release" -maxdepth 1 -name '*.app' -type d -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/SimpleMTKClient-macOS.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMTKClient-macOS
          path: ${{ runner.temp }}/SimpleMTKClient-macOS.zip
